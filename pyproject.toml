[project]
name = "surya-ocr"
version = "0.24.0"
description = "OCR, layout, reading order, and table recognition in 90+ languages."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vik Paruchuri", email = "vik@datalab.to" },
]
requires-python = ">=3.10,<4"
keywords = ["ocr", "pdf", "layout", "text recognition", "tables", "vlm"]
dependencies = [
    "pydantic>=2.5.3,<3",
    "pydantic-settings>=2.1.0,<3",
    "python-dotenv>=1.0.0,<2",
    "pillow>=10.2.0,<14",
    "pypdfium2>=4.18.0,<6",
    "filetype>=1.2.0,<2",
    "click>=8.1.8,<9",
    "platformdirs>=4.3.6,<5",
    "openai>=1.55.0,<3",
    "httpx>=0.27.0,<1",
    "huggingface-hub>=0.34.0,<2",
    "filelock>=3.16.0",
    "beautifulsoup4>=4.12.0,<5",
    "numpy>=1.26.0,<3",
    "tqdm>=4.66.0,<5",
]

[project.optional-dependencies]
build = [
    "transformers>=4.45.0",
    "torch>=2.4.0",
]

[project.urls]
Repository = "https://github.com/datalab-to/surya"

[project.scripts]
surya_ocr = "surya.scripts.ocr_text:ocr_text_cli"
surya_layout = "surya.scripts.detect_layout:detect_layout_cli"
surya_table = "surya.scripts.table_recognition:table_recognition_cli"
surya_gui = "surya.scripts.viewer:viewer_cli"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "jupyter>=1.0.0",
    "pymupdf>=1.23.8",
    "datasets>=2.16.1",
    "pytest>=8.3.4",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surya"]
